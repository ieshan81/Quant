# Nixpacks build — no Dockerfile. Root directory: "."
# If Railway UI ignores NIXPACKS in config-as-code, set Builder → Nixpacks manually.

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "bash start.sh"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
